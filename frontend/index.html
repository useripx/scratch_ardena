<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ardena Playground — AI-Assisted Scratch 3.0 Game Studio</title>
    <meta name="description" content="Platform Pemrograman Visual Berbasis Scratch 3.0 & AI Copilot untuk Semua Usia" />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    
    <!-- Google Fonts: Plus Jakarta Sans & Fira Code -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- Tailwind CSS CDN for instant zero-config styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ardena: {
                primary: '#006194',
                secondary: '#007bb9',
                surface: '#f7f9fb',
                dark: '#191c1e',
              }
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
              mono: ['"Fira Code"', 'monospace'],
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#f7f9fb] text-[#191c1e] font-sans antialiased m-0 p-0">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

</html>
